services:
  - type: web
    name: turnero-barberia
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: sh -c "export PATH=$PATH:$HOME/.local/bin:./venv/bin:/opt/render/project/src/.venv/bin; exec uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TIMEZONE
        value: America/Argentina/Buenos_Aires
